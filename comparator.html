<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Parallel Manuscript Comparator</title>
<style>
  :root {
    --bg:#1a1a1a; --panel:#222; --fg:#e0e0e0; --muted:#9a9a9a;
    --line:#333; --accent:#4a9eff; --highlight:#ffff0033;
  }
  * { box-sizing:border-box; }
  body {
    background:var(--bg); color:var(--fg); font-family:Arial, sans-serif;
    margin:0; padding:16px 20px 40px; line-height:1.6;
    height: 100vh; overflow: hidden; display: flex; flex-direction: column;
  }

  .topbar {
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    border-bottom:1px solid var(--line); padding-bottom:12px; margin-bottom:12px;
    flex-shrink: 0;
  }
  .topbar h1 { font-size:1.1rem; margin:0; color:#fff; flex:1 1 auto; }
  .btn {
    display:inline-block; background:#2d2d2d; color:var(--fg);
    border:1px solid var(--line); border-radius:5px;
    padding:6px 12px; font-size:.88rem; text-decoration:none;
    cursor:pointer; white-space:nowrap;
  }
  .btn:hover { background:#3a3a3a; border-color:#555; }
  .btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }

  select.nav-select {
    background:#2d2d2d; color:var(--fg); border:1px solid var(--line);
    border-radius:5px; padding:6px 10px; font-size:.88rem;
  }

  .comparator-wrap {
    display: flex; gap: 20px; flex-grow: 1; overflow: hidden;
  }

  .column {
    flex: 1; display: flex; flex-direction: column; min-width: 0;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    overflow: hidden;
  }

  .col-header {
    background: #2a2a2a; padding: 10px 15px; border-bottom: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
  }
  .col-header h2 { margin: 0; font-size: 1rem; color: #fff; }

  .col-tabs {
    display: flex; border-bottom: 1px solid var(--line); flex-shrink: 0;
    background: #252525;
  }
  .col-tab-btn {
    flex: 1; background: none; border: none; color: var(--muted);
    padding: 8px 5px; font-size: 0.85rem; cursor: pointer;
    border-bottom: 2px solid transparent; transition: 0.2s;
  }
  .col-tab-btn:hover { color: #fff; }
  .col-tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: bold; }

  .col-body {
    flex-grow: 1; overflow-y: auto; padding: 15px; position: relative;
  }

  /* Scan Viewer Styles */
  .scan-viewer { display: none; height: 100%; position: relative; overflow: hidden; background: #111; border-radius: 4px; }
  .scan-viewer.active { display: flex; align-items: center; justify-content: center; }
  .scan-viewer img { display: block; width: 100%; height: auto; cursor: zoom-in; transition: transform 0.1s ease; transform-origin: 0 0; }
  .scan-tools {
    position: absolute; top: 8px; left: 8px; right: 8px;
    display: flex; justify-content: space-between;
    background: rgba(0,0,0,0.5); padding: 4px 8px; border-radius: 4px; z-index: 2; font-size: 0.8rem;
  }

  /* Text Output Styles */
  .text-output { display: none; padding-right: 5px; }
  .text-output.active { display: block; }
  .text-output h1, .text-output h2 { color: #fff; }
  .text-output a { color: var(--accent); }
  .text-output blockquote { border-left: 4px solid #555; margin-left: 0; padding-left: 15px; color: #b0b0b0; }
  .text-output pre { background: #2d2d2d; padding: 10px; border-left: 4px solid var(--accent); border-radius: 4px; overflow: auto; }

  .anchor-highlight { background-color: var(--highlight); border-radius: 3px; padding: 2px 4px; font-weight: bold; color: #fff; border-bottom: 2px solid yellow; }

  .loading-msg { padding: 20px; font-style: italic; color: var(--muted); text-align: center; }
  .error-msg { padding: 15px; color: #ff6b6b; background: #2a1414; border: 1px solid #ff6b6b55; border-radius: 6px; }

</style>
</head>
<body>

  <div class="topbar">
    <a class="btn" href="index.html">← Index</a>
    <h1>Parallel Comparator</h1>

    <select id="ms-select" class="nav-select">
      <option value="sejarah">Sejarah Ratu Tanah Jawa</option>
      <option value="hikayat">Hikayat Ratu Tanah Jawa</option>
    </select>

    <select id="folio-select" class="nav-select">
      <option value="">Select Folio...</option>
    </select>

    <button id="btn-prev" class="btn">‹ Prev Folio</button>
    <button id="btn-next" class="btn">Next Folio ›</button>

    <button id="btn-sync" class="btn active">🔒 Sync Locked</button>
  </div>

  <div class="comparator-wrap">

    <!-- LEFT COLUMN: 1838 PEGON -->
    <div class="column" id="col-left">
      <div class="col-header">
        <h2 id="left-title">1838 Pegon Manuscript</h2>
      </div>
      <div class="col-tabs">
        <button class="col-tab-btn left-tab active" data-target="left-scan">Scan Image</button>
        <button class="col-tab-btn left-tab" data-target="left-pegon">Pegon Script</button>
        <button class="col-tab-btn left-tab" data-target="left-latin">Latin Translit.</button>
        <button class="col-tab-btn left-tab" data-target="left-en">English</button>
      </div>
      <div class="col-body">
        <div id="left-scan" class="scan-viewer active">
          <div class="scan-tools"><span id="left-scan-note">Loading...</span><a href="#" id="left-scan-link" target="_blank" style="color:#fff;">Full Size</a></div>
          <img id="left-scan-img" src="" alt="">
        </div>
        <div id="left-pegon" class="text-output"></div>
        <div id="left-latin" class="text-output"></div>
        <div id="left-en" class="text-output"></div>
      </div>
    </div>

    <!-- RIGHT COLUMN: 1973 TYPESCRIPT -->
    <div class="column" id="col-right">
      <div class="col-header">
        <h2 id="right-title">1973 Sastrasuganda Typescript</h2>
      </div>
      <div class="col-tabs">
        <button class="col-tab-btn right-tab" data-target="right-scan">Scan Image</button>
        <button class="col-tab-btn right-tab active" data-target="right-md">Javanese Text</button>
        <button class="col-tab-btn right-tab" data-target="right-en">English</button>
      </div>
      <div class="col-body">
        <div id="right-scan" class="scan-viewer">
          <div class="scan-tools"><span id="right-scan-note">Loading...</span><a href="#" id="right-scan-link" target="_blank" style="color:#fff;">Full Size</a></div>
          <img id="right-scan-img" src="" alt="">
        </div>
        <div id="right-md" class="text-output active"></div>
        <div id="right-en" class="text-output"></div>
      </div>
    </div>

  </div>

<script src="comparator-index.js"></script>
<script src="marked.min.js"></script>
<script src="comparator.js"></script>
</body>
</html>
