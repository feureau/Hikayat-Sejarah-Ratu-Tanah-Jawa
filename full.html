<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Full Manuscript Reader</title>
<style>
  :root {
    --bg:#1a1a1a; --panel:#222; --fg:#e0e0e0; --muted:#9a9a9a;
    --line:#333; --accent:#4a9eff;
  }
  * { box-sizing:border-box; }
  body {
    background:var(--bg); color:var(--fg); font-family:Arial, sans-serif;
    margin:0; padding:16px 20px 60px; line-height:1.65;
  }
  .wrap { max-width:1100px; margin:0 auto; }

  .topbar {
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    border-bottom:1px solid var(--line); padding-bottom:12px; margin-bottom:20px;
    position:sticky; top:0; background:var(--bg); z-index:100;
  }
  .topbar h1 {
    font-size:1.1rem; margin:0; color:#fff; flex:1 1 260px;
    min-width:0; overflow-wrap:anywhere;
  }
  .btn {
    display:inline-block; background:#2d2d2d; color:var(--fg);
    border:1px solid var(--line); border-radius:5px;
    padding:6px 12px; font-size:.88rem; text-decoration:none;
    cursor:pointer; white-space:nowrap;
  }
  .btn:hover { background:#3a3a3a; border-color:#555; }

  .page-jump-select {
    background:#2d2d2d; color:var(--fg); border:1px solid var(--line);
    border-radius:5px; padding:6px 10px; font-size:.88rem;
  }

  /* Tabs CSS */
  .tab-buttons {
    display: flex; gap: 6px; margin-bottom: 20px; flex-wrap: wrap;
    position:sticky; top:50px; background:var(--bg); padding:10px 0; z-index:99;
    border-bottom:1px solid var(--line);
  }
  .tab-btn {
    background: #2d2d2d; color: #aaa; border: 1px solid var(--line);
    padding: 8px 16px; border-radius: 4px; cursor: pointer;
    font-size: 0.9rem; flex-grow: 1; transition: 0.2s;
  }
  .tab-btn:hover { background: #3a3a3a; color: #fff; }
  .tab-btn.active { background: var(--accent); color: #fff; font-weight: bold; border-color:var(--accent); }

  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* Page Block Styling */
  .page-block {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 25px 30px; margin-bottom: 30px;
  }
  .page-header {
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 2px solid var(--accent); padding-bottom: 10px; margin-bottom: 20px;
    flex-wrap: wrap; gap: 10px;
  }
  .page-header h2 { margin: 0; color: #fff; font-size: 1.25rem; }
  .page-header .dual-btn {
    background: var(--accent); color: #fff; border: none; padding: 4px 10px;
    border-radius: 4px; text-decoration: none; font-size: 0.82rem; font-weight: bold;
  }
  .page-header .dual-btn:hover { background: #3582e0; }

  .transcript-output h1,
  .transcript-output h2,
  .transcript-output h3,
  .transcript-output h4 { color:#fff; line-height:1.25; }
  .transcript-output h1 { font-size:1.4rem; margin:.2em 0 .6em; }
  .transcript-output h2 { font-size:1.15rem; border-bottom:1px solid var(--line); padding-bottom:.25em; margin-top:1.4em; }
  .transcript-output p { margin:0 0 1em; }
  .transcript-output a { color:var(--accent); }
  .transcript-output code { background:#2d2d2d; padding:2px 5px; border-radius:3px; font-size:.95em; }
  .transcript-output pre { background:#2d2d2d; padding:14px; border-left:4px solid var(--accent); overflow:hidden; border-radius:4px; }
  .transcript-output pre code { background:transparent; padding:0; }
  .transcript-output blockquote { border-left:4px solid #555; margin-left:0; padding-left:15px; color:#b0b0b0; }
  .transcript-output hr { border:0; border-top:1px solid var(--line); margin:2em 0; }

  .loading-msg { padding: 40px; text-align: center; font-style: italic; color: var(--muted); font-size: 1.1rem; }
  .error-msg { padding: 20px; color: #ff6b6b; background: #2a1414; border: 1px solid #ff6b6b55; border-radius: 6px; margin-bottom:20px; }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <a class="btn" href="index.html">← Index</a>
    <h1 id="doc-title">Loading Full Document…</h1>
    <select class="page-jump-select" id="page-jump" aria-label="Jump to page">
      <option value="">Jump to Page…</option>
    </select>
  </div>

  <div class="tab-buttons" id="tab-buttons" style="display:none;">
    <button class="tab-btn active" data-target="tab-md">Transcription</button>
    <button class="tab-btn" data-target="tab-en">Transliteration</button>
    <button class="tab-btn" id="btn-tab-translation" data-target="tab-translation">Translation</button>
  </div>

  <div id="tab-md" class="tab-content transcript-output active"></div>
  <div id="tab-en" class="tab-content transcript-output"></div>
  <div id="tab-translation" class="tab-content transcript-output"></div>

</div>

<script src="config.js"></script>
<script src="marked.min.js"></script>
<script src="full.js"></script>
</body>
</html>
